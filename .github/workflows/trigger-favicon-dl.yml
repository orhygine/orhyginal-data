# This workflow triggers after GitHub Pages deployment, only if 'osm-links.yaml' was updated,
# and then triggers the 'favicon-dl' workflow in the 'orhyginal-map' repository.

name: Trigger favicon-dl after Pages deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types:
      - completed

jobs:
  trigger-favicon-dl:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orhyginal-data at commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check if osm-links.yaml was updated
        id: check_file
        run: |
          git fetch origin ${{ github.event.workflow_run.head_branch }}
          git diff --name-only ${{ github.event.workflow_run.head_sha }}^ ${{ github.event.workflow_run.head_sha }} | grep 'osm-links.yaml' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Trigger favicon-dl workflow in orhyginal-map
        if: steps.check_file.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEB_REPO_ACCESS_TOKEN }}
          repository: orhygine/orhyginal-map
          event-type: run-favicon-dl
          client-payload: '{"source_repo": "orhyginal-data", "triggered_by": "pages build and deployment"}'
